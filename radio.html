<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إذاعة هُدَى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #05070a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .radio-card { background: rgba(22,27,34,0.8); border: 2px solid #e3b341; padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 0 30px rgba(227,179,65,0.2); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    </style>
</head>
<body class="p-6">
    <button onclick="location.href='index.html'" class="absolute top-10 right-10 text-[#e3b341]">✕ رجوع</button>
    
    <div class="radio-card w-full max-w-sm">
        <img src="https://img.icons8.com/ios-filled/100/e3b341/radio-waves.png" class="mx-auto mb-6 pulse">
        <h2 class="text-xl font-bold mb-6">إذاعة القرآن الكريم</h2>
        <button id="playBtn" onclick="toggleRadio()" class="bg-[#e3b341] text-black w-full py-4 rounded-2xl font-bold text-lg">تـشـغـيـل الإذاعة</button>
        <p id="status" class="mt-4 text-xs text-gray-500 italic">البث المباشر متوقف</p>
    </div>

    <script>
        let radio = new Audio('https://quran.yousefheiba.com/api/radio');
        function toggleRadio() {
            const btn = document.getElementById('playBtn');
            const status = document.getElementById('status');
            if (radio.paused) {
                radio.play();
                btn.innerText = "إيـقـاف الإذاعة";
                btn.classList.add('bg-red-500');
                status.innerText = "جاري البث المباشر الآن...";
            } else {
                radio.pause();
                btn.innerText = "تـشـغـيـل الإذاعة";
                btn.classList.remove('bg-red-500');
                status.innerText = "البث المباشر متوقف";
            }
        }
    </script>
</body>
</html>
