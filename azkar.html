<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أذكار هُدَى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #05070a; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: sans-serif; }
        .paper-window { background: #fffdf2; color: #1a1a1a; padding: 30px; border-radius: 25px; border: 4px solid #e3b341; text-align: center; min-height: 250px; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body>
    <button onclick="location.href='index.html'" class="self-start text-[#e3b341] mb-10">✕ رجوع</button>
    
    <div id="azkarWindow" class="paper-window w-full max-w-md shadow-2xl">
        <p id="zekrText" class="text-xl font-bold leading-relaxed">جاري تحميل الأذكار...</p>
        <p id="zekrCount" class="mt-4 text-sm text-gray-500"></p>
    </div>

    <button onclick="nextZekr()" class="mt-10 bg-[#e3b341] text-black font-bold px-12 py-4 rounded-2xl">الذكر التالي</button>

    <script>
        let azkar = []; let idx = 0;
        fetch('https://quran.yousefheiba.com/api/azkar')
            .then(r => r.json()).then(data => {
                azkar = data; 
                display();
            });

        function display() {
            if(azkar.length > 0) {
                document.getElementById('zekrText').innerText = azkar[idx].zekr;
                document.getElementById('zekrCount').innerText = "التكرار المطلوب: " + azkar[idx].count;
            }
        }

        function nextZekr() {
            idx = (idx + 1) % azkar.length;
            display();
        }
    </script>
</body>
</html>
