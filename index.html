<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL - SYSTEM BREACH</title>
    <style>
        body {
            background-color: black;
            color: #00FF41; /* لون الهكر التقليدي */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #terminal {
            padding: 20px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: absolute;
            top: 0;
            left: 0;
        }

        .line {
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid #00FF41;
            animation: typing 0.5s steps(30, end), blink 0.5s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #00FF41 }
        }

        /* تنسيق الرسالة العريضة في المنتصف */
        #hacked-message {
            display: none; /* مخفية في البداية */
            position: absolute;
            background-color: rgba(255, 0, 0, 0.85); /* خلفية حمراء شفافة */
            color: white;
            font-size: 3em;
            font-weight: bold;
            text-align: center;
            padding: 40px;
            width: 80%;
            border: 5px solid white;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
            z-index: 100;
            text-shadow: 2px 2px 4px #000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 0, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 0, 0, 1); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 0, 0.7); }
        }

        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
    </style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div id="terminal">
    <div class="line">Establishing connection to secure server... DONE</div>
    <div class="line">Bypassing Firewall... 10%</div>
    <div class="line">Bypassing Firewall... 45%</div>
    <div class="line">Bypassing Firewall... 99%</div>
    <div class="line" style="color: red;">[CRITICAL] ENCRYPTION KEY FOUND</div>
    <div class="line">Downloading User Data: [||||||||||          ] 50%</div>
    <div class="line">Accessing Private Files... SUCCESS</div>
</div>

<div id="hacked-message">
    تم الاختراق عن طريق عيد السيبراني
</div>

<script>
    // تأثير مصفوفة الرموز (Matrix) في الخلفية
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];

    for (let i = 0; i < columns; i++) {
        drops[i] = 1;
    }

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px arial";

        for (let i = 0; i < drops.length; i++) {
            const text = characters.charAt(Math.floor(Math.random() * characters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    setInterval(drawMatrix, 35);

    // إضافة نصوص عشوائية توحي بالتهكير ثم إظهار الرسالة
    const terminal = document.getElementById('terminal');
    const logs = [
        "> Scanning network interfaces...",
        "> IP Address found: 192.168.1.104",
        "> Injecting SQL payload...",
        "> Root access granted.",
        "> Fetching browsing history...",
        "> Extracting passwords...",
        "> SYSTEM FAILURE IMMINENT",
        "> Sending data to remote server...",
        "> ------------------------------------",
        "> OPERATION COMPLETE."
    ];

    let i = 0;
    function addLog() {
        if (i < logs.length) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = logs[i];
            terminal.appendChild(div);
            i++;
        } else {
            clearInterval(logInterval);
            showHackedMessage();
        }
    }

    const logInterval = setInterval(addLog, 1200); // سرعة ظهور الأسطر

    function showHackedMessage() {
        document.getElementById('hacked-message').style.display = 'block';
    }
</script>

</body>
</html>
