<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت هُدَى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #05070a; color: #f0f6fc; font-family: sans-serif; overflow-x: hidden; }
        .space-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--d) infinite; }
        .planet { position: absolute; background: radial-gradient(circle, #e3b341, #9e7a25); border-radius: 50%; opacity: 0.3; animation: float var(--d) infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        @keyframes float { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(20px, -20px); } }
        .card { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(227, 179, 65, 0.2); transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card:hover { border-color: #e3b341; transform: translateY(-5px); }
        .icon-gold { filter: sepia(100%) saturate(500%) hue-rotate(10deg); width: 40px; margin-bottom: 10px; }
    </style>
</head>
<body class="p-6 flex flex-col items-center">
    <div class="space-bg" id="space"></div>
    <header class="text-center mt-8 mb-10">
        <h1 class="text-4xl font-bold text-[#e3b341]">بوت هُدَى</h1>
    </header>

    <div class="grid grid-cols-2 gap-4 w-full max-w-sm">
        <div onclick="location.href='quran.html'" class="card p-5 rounded-2xl shadow-xl">
            <img src="https://img.icons8.com/ios-filled/100/ffffff/quran.png" class="icon-gold">
            <span class="text-xs font-bold">المصحف</span>
        </div>
        <div onclick="location.href='azkar.html'" class="card p-5 rounded-2xl shadow-xl">
            <img src="https://img.icons8.com/ios-filled/100/ffffff/beads.png" class="icon-gold">
            <span class="text-xs font-bold">الأذكار</span>
        </div>
        <div onclick="location.href='duas.html'" class="card p-5 rounded-2xl shadow-xl">
            <img src="https://img.icons8.com/ios-filled/100/ffffff/praying-hands.png" class="icon-gold">
            <span class="text-xs font-bold">الأدعية</span>
        </div>
        <div onclick="location.href='prayer.html'" class="card p-5 rounded-2xl shadow-xl">
            <img src="https://img.icons8.com/ios-filled/100/ffffff/mosque.png" class="icon-gold">
            <span class="text-xs font-bold">مواقيت الصلاة</span>
        </div>
        <div onclick="location.href='radio.html'" class="card p-5 rounded-2xl shadow-xl">
            <img src="https://img.icons8.com/ios-filled/100/ffffff/radio-waves.png" class="icon-gold">
            <span class="text-xs font-bold">الإذاعة</span>
        </div>
        <div onclick="location.href='live.html'" class="card p-5 rounded-2xl shadow-xl">
            <img src="https://img.icons8.com/ios-filled/100/ffffff/kaaba.png" class="icon-gold">
            <span class="text-xs font-bold">بث مباشر</span>
        </div>
    </div>

    <footer class="mt-10 text-center">
        <p class="text-[#e3b341] text-sm font-bold">تطوير: [اسمك هنا]</p>
        <p class="text-[10px] text-gray-500">جميع الحقوق محفوظة لـ هُدَى © ٢٠٢٦</p>
    </footer>

    <script>
        const space = document.getElementById('space');
        for (let i = 0; i < 60; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.width = s.style.height = Math.random() * 2 + 'px';
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.setProperty('--d', Math.random() * 3 + 2 + 's');
            space.appendChild(s);
        }
    </script>
</body>
</html>
