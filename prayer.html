<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مواقيت الصلاة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#05070a] text-white p-6 flex flex-col items-center">
    <button onclick="location.href='index.html'" class="self-start text-[#e3b341]">← رجوع</button>
    <h2 class="text-2xl font-bold my-8 text-[#e3b341]">مواقيت الصلاة</h2>
    <div id="times" class="w-full max-w-sm space-y-4">
        جاري تحديد موقعك وجلب الأوقات...
    </div>

    <script>
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const res = await fetch('https://quran.yousefheiba.com/api/getPrayerTimes');
            const data = await res.json();
            // هنا نفترض أن الـ API يعيد الأوقات بناءً على الطلب
            let html = "";
            for (let [key, val] of Object.entries(data.times)) {
                html += `<div class="bg-gray-900 p-4 rounded-xl flex justify-between"><span>${key}</span><span>${val}</span></div>`;
            }
            document.getElementById('times').innerHTML = html;
        });
    </script>
</body>
</html>
